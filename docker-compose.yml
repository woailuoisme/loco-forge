# Loco 应用 —— API / Worker / Scheduler 三进程形态
# 共享配置抽成 x-app 锚点，各服务用 <<: *app 合并后覆盖 command / container_name / ports
# 注意：容器内应用写入目录是 /app/storages（复数），宿主侧挂载为 ./storage

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: loco:local
  pull_policy: build
  restart: unless-stopped
  env_file:
    - path: .env.production
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - backend
  volumes:
    - ./storage:/app/storages

services:
  api:
    <<: *app
    container_name: loco-api
    command: ["start"]
    ports:
      - "5150:5150"

  worker:
    <<: *app
    container_name: loco-worker
    command: ["start", "--worker"]

  scheduler:
    <<: *app
    container_name: loco-scheduler
    command: ["start", "--scheduler"]

networks:
  backend:
    external: true
