services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loco_app
    command: start
    ports:
      - "5150:5150"
    env_file:
      - .env.production
    # volumes:
    #   - ./config:/app/config
    #   - ./locales:/app/locales
    # 允许容器通过 host.docker.internal 访问宿主机服务：
    # - Postgres: postgres://user:pass@host.docker.internal:5432/db_name
    # - Redis:    redis://host.docker.internal:6379
    # - Mailer:   host: host.docker.internal / port: 1025
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    external: true



