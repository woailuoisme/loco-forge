# CNB 流水线 — Loco 应用 Docker 镜像构建与推送（Trixie Debian Slim / Alpine Musl）
# 文档: https://docs.cnb.cool/build/quick-start.html
#
# 内置变量 (CNB 自动注入):
#   CNB_DOCKER_REGISTRY      — 镜像仓库地址，如 docker.cnb.cool
#   CNB_REPO_SLUG_LOWERCASE  — 仓库路径小写，如 my-org/my-repo
#

$:
  # ── 1. 手动触发：Trixie 极速构建 (仅 linux/amd64) ─────────────────────────
  web_trigger_amd64:
    - services:
        - docker
      stages:
        - name: Build and push Trixie (amd64 only)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"

            docker buildx build \
              --platform linux/amd64 \
              --tag "${REGISTRY}:trixie" \
              --tag "${REGISTRY}:trixie-amd64" \
              --file ./Dockerfile \
              --cache-from "type=registry,ref=${REGISTRY}:cache-amd64" \
              --cache-to "type=registry,ref=${REGISTRY}:cache-amd64,mode=max,image-manifest=true,oci-mediatypes=true" \
              --push \
              .

  # ── 2. 手动触发：Trixie 全架构构建 (linux/amd64 + linux/arm64) ────────────
  web_trigger_multi:
    - services:
        - docker
      stages:
        - name: Build and push Trixie multi-arch (amd64 + arm64)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"

            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "${REGISTRY}:trixie" \
              --tag "${REGISTRY}:trixie-multi" \
              --file ./Dockerfile \
              --cache-from "type=registry,ref=${REGISTRY}:cache-multi" \
              --cache-to "type=registry,ref=${REGISTRY}:cache-multi,mode=max,image-manifest=true,oci-mediatypes=true" \
              --push \
              .

  # ── 3. 手动触发：Alpine 极速构建 (仅 linux/amd64) ─────────────────────────
  web_trigger_alpine_amd64:
    - services:
        - docker
      stages:
        - name: Build and push Alpine (amd64 only)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"

            docker buildx build \
              --platform linux/amd64 \
              --tag "${REGISTRY}:alpine" \
              --tag "${REGISTRY}:alpine-amd64" \
              --file ./Dockerfile.alpine \
              --cache-from "type=registry,ref=${REGISTRY}:cache-alpine-amd64" \
              --cache-to "type=registry,ref=${REGISTRY}:cache-alpine-amd64,mode=max,image-manifest=true,oci-mediatypes=true" \
              --push \
              .

  # ── 4. 手动触发：Alpine 全架构构建 (linux/amd64 + linux/arm64) ───────────
  web_trigger_alpine_multi:
    - services:
        - docker
      stages:
        - name: Build and push Alpine multi-arch (amd64 + arm64)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"

            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "${REGISTRY}:alpine" \
              --tag "${REGISTRY}:alpine-multi" \
              --file ./Dockerfile.alpine \
              --cache-from "type=registry,ref=${REGISTRY}:cache-alpine-multi" \
              --cache-to "type=registry,ref=${REGISTRY}:cache-alpine-multi,mode=max,image-manifest=true,oci-mediatypes=true" \
              --push \
              .

  # ── 5. v* tag push：版本发布自动构建双架构镜像 ─────────────────────────
  tag_push:
    - services:
        - docker
      stages:
        - name: Build and push release (trixie)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${CNB_BRANCH##*/}"

            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "${REGISTRY}:${VERSION}" \
              --tag "${REGISTRY}:${VERSION}-trixie" \
              --file ./Dockerfile \
              --cache-from "type=registry,ref=${REGISTRY}:cache-multi" \
              --cache-to "type=registry,ref=${REGISTRY}:cache-multi,mode=max,image-manifest=true,oci-mediatypes=true" \
              --push \
              .
