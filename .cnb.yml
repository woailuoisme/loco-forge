# CNB 流水线 — Loco 应用 Docker 镜像构建与推送（Trixie Debian Slim）
# 文档: https://docs.cnb.cool/build/quick-start.html
#
# 内置变量 (CNB 自动注入):
#   CNB_DOCKER_REGISTRY      — 镜像仓库地址，如 docker.cnb.cool
#   CNB_REPO_SLUG_LOWERCASE  — 仓库路径小写，如 my-org/my-repo
#
# 同事件下多个 pipeline 并行执行（类似 GitHub Actions matrix）
# 仅构建 linux/amd64（CNB runner 不支持 --privileged 无法运行 QEMU 交叉编译）

# ── main 分支 push（已禁用：push 不自动构建）────────────────────────────
# main:
#   push:
#     ...

# ── 手动触发：构建 trixie 镜像 ──────────────────────────────────────────
$:
  web_trigger:
    - services:
        - docker
      stages:
        - name: Build and push (trixie)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"

            docker buildx build \
              --tag "${REGISTRY}:trixie" \
              --file ./Dockerfile \
              --cache-from "type=registry,ref=${REGISTRY}:trixie" \
              --cache-to type=inline,mode=max \
              --push \
              .


# ── v* tag push：构建并推送版本化 tag ──────────────────────────────────
  tag_push:
    - services:
        - docker
      stages:
        - name: Build and push release (trixie)
          script: |
            set -euo pipefail
            REGISTRY="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            VERSION="${CNB_BRANCH##*/}"

            docker buildx build \
              --tag "${REGISTRY}:${VERSION}" \
              --tag "${REGISTRY}:${VERSION}-trixie" \
              --file ./Dockerfile \
              --cache-from "type=registry,ref=${REGISTRY}:trixie" \
              --cache-to type=inline,mode=max \
              --push \
              .
