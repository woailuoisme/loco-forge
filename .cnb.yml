# CNB 流水线 — Loco 应用 Docker 双镜像构建与推送
# 文档: https://docs.cnb.cool/build/quick-start.html

env:
  # 镜像仓库根路径，例如 cnb.cool/your-org/your-repo
  REGISTRY: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}

# ── main 分支 push：构建 trixie + alpine，推 latest / 变体 tag ──────────
main:
  push:
    - services:
        - docker
      stages:
        - name: Build and push (trixie)
          script: |
            set -euo pipefail

            docker build \
              --tag "${REGISTRY}:latest" \
              --tag "${REGISTRY}:trixie" \
              --file ./Dockerfile \
              .

            docker push "${REGISTRY}:latest"
            docker push "${REGISTRY}:trixie"

        - name: Build and push (alpine)
          script: |
            set -euo pipefail

            docker build \
              --tag "${REGISTRY}:alpine" \
              --file ./Dockerfile.alpine \
              .

            docker push "${REGISTRY}:alpine"

# ── 手动触发：在分支详情页点击按钮执行 ──────────────────────────────────
$:
  web_trigger:
    - services:
        - docker
      stages:
        - name: Build and push (trixie)
          script: |
            set -euo pipefail

            TAG="${VERSION:-manual}"
            docker build \
              --tag "${REGISTRY}:latest" \
              --tag "${REGISTRY}:trixie" \
              --tag "${REGISTRY}:${TAG}" \
              --tag "${REGISTRY}:${TAG}-trixie" \
              --file ./Dockerfile \
              .

            docker push "${REGISTRY}:latest"
            docker push "${REGISTRY}:trixie"
            docker push "${REGISTRY}:${TAG}"
            docker push "${REGISTRY}:${TAG}-trixie"

        - name: Build and push (alpine)
          script: |
            set -euo pipefail

            TAG="${VERSION:-manual}"
            docker build \
              --tag "${REGISTRY}:alpine" \
              --tag "${REGISTRY}:${TAG}-alpine" \
              --file ./Dockerfile.alpine \
              .

            docker push "${REGISTRY}:alpine"
            docker push "${REGISTRY}:${TAG}-alpine"

# ── v* tag push：额外推送版本化 tag ──────────────────────────────────────
  tag_push:
    - services:
        - docker
      stages:
        - name: Build and push release (trixie)
          script: |
            set -euo pipefail

            # 从 refs/tags/v1.2.3 提取 v1.2.3
            VERSION="${CNB_BRANCH##*/}"

            docker build \
              --tag "${REGISTRY}:latest" \
              --tag "${REGISTRY}:${VERSION}" \
              --tag "${REGISTRY}:${VERSION}-trixie" \
              --file ./Dockerfile \
              .

            docker push "${REGISTRY}:latest"
            docker push "${REGISTRY}:${VERSION}"
            docker push "${REGISTRY}:${VERSION}-trixie"

        - name: Build and push release (alpine)
          script: |
            set -euo pipefail

            VERSION="${CNB_BRANCH##*/}"

            docker build \
              --tag "${REGISTRY}:alpine" \
              --tag "${REGISTRY}:${VERSION}-alpine" \
              --file ./Dockerfile.alpine \
              .

            docker push "${REGISTRY}:alpine"
            docker push "${REGISTRY}:${VERSION}-alpine"
