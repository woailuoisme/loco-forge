# ==============================================================================
# Clippy 认知复杂度与代码质量阀值配置 (.clippy.toml)
# Note: MSRV (最低支持 Rust 版本) 会自动继承 Cargo.toml 中的 rust-version，无需在此重复申明
# ==============================================================================

# 单个函数认知复杂度上限 (Cognitive Complexity Threshold)
# 超过 25 会触发 clippy::cognitive_complexity 警告，提示拆分复杂逻辑
cognitive-complexity-threshold = 25

# 单个函数入参个数上限 (Too Many Arguments Threshold)
# 超过 8 个参数会触发 clippy::too_many_arguments 警告 (适配 Axum/Loco 组合 Extractor)
too-many-arguments-threshold = 8

# 异步 Future 结构体体积上限 (单位: Byte)
# 超过 16KB 会触发 clippy::large_futures 警告，防止 Tokio 异步任务状态机过大引发栈溢出
future-size-threshold = 16384

# 栈上静态数组分配体积上限 (单位: Byte)
# 超过 500KB 会触发 clippy::large_stack_arrays 警告，提示使用 Box 或 Vec 分配堆内存
array-size-threshold = 512000

# 数值字面量下划线分隔阈值 (Literal Representation Threshold)
# 超过 16384 的纯整数字面量建议添加下划线 (如 1_000_000)，提高代码可读性
literal-representation-threshold = 16384

# 函数按值传递类型体积上限 (单位: Byte)
# 超过 256 字节的结构体建议传引用 (&T)，配合 trivially_copy_pass_by_ref 优化传参开销
pass-by-value-size-limit = 256

# 文档注释中允许包含的专有名词/大写缩写列表 (Doc Markdown Exemption)
# 防止 clippy 检查将技术专有名词识别为缺少反引号包裹的格式警告
doc-valid-idents = [
    "Loco", "SeaORM", "Axum", "Tokio", "Redis", "Meilisearch", "DTO", "JWT",
    "PostgreSQL", "SQLite", "OpenAPI", "Valkey", "Garage", "UUID", "MSRV", "S3",
    "JSON", "HTTP", "URL", "HTML", "REST"
]
