# rust-analyzer 项目级配置 (IDE 启动 Rust 语言服务时自动加载)

[imports]
granularity = { enforce = true, group = "crate" } # use 导入按 crate 分组
prefix = "crate"                                  # 内部模块统一使用 crate:: 绝对路径
preferNoStd = false                               # 使用 std
preferPrelude = true                              # 优先补全 Prelude 符号

[check]
command = "clippy" # 保存时运行 clippy
allTargets = true  # 覆盖 src/ tests/ benches/
features = "all"   # 等价于 cargo --all-features

[cargo]
allTargets = true
features = "all"
autoreload = true  # Cargo.toml 变更时自动刷新元数据

[cargo.buildScripts]
enable = true        # 运行 build.rs，提取编译期环境变量
rebuildOnSave = true # 保存时增量重跑 build.rs

# 注：procMacro.enable 与 procMacro.attributes.enable 已被新版移除 (默认即为 true)，
#     继续书写旧字段会触发 "unexpected field" 配置告警，故此处不再声明。
