[test-groups]
# 定义独占数据库锁的受限组，同时只能有 1 个测试在运行
db-tests = { max-threads = 1 }

[profile.default]
# 默认按 CPU 核心数全速并发运行普通/无状态单元测试
test-threads = "num-cpus"

# 针对触碰测试数据库与 IO 资源的集成测试，指派至 db-tests 单线程组
[[profile.default.overrides]]
filter = 'test(models::) or test(requests::) or test(tasks::) or test(common::)'
test-group = 'db-tests'
