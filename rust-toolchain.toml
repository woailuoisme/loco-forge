# Loco 项目 Rust 工具链统一配置文件 (Rust Toolchain Configuration)

[toolchain]
# 1. 编译器渠道：使用最新稳定版 Stable (保障生产环境与 CI/CD 极度稳定)
channel = "stable"

# 2. 核心组件：格式化 (rustfmt)、静态检查 (clippy)、标准库源码 (rust-src)、IDE 分析器 (rust-analyzer)
components = [
    "rustfmt",
    "clippy",
    "rust-src",        # rust-analyzer 标准库智能补全与代码跳转所必需
    "rust-analyzer",   # Rust-Analyzer 官方分析器组件
]

# 3. 目标架构：Linux 部署目标链 (方便本地与 CI 直接进行 Linux 交叉编译/Docker 构建)
targets = [
    "x86_64-unknown-linux-gnu",
]
