# Loco 项目 Rustfmt 稳定版 (Stable) 最佳实践配置

# 行宽与排版紧凑度
max_width = 120                 # 每行最大字符数限制（适应现代宽屏显示器）
use_small_heuristics = "Default" # 启发式规则：保持 Rust 官方推荐的平衡折行密度

# 基础排序与格式规范
reorder_imports = true          # 自动按字母顺序对导入路径 (use) 进行排序
reorder_modules = true          # 自动按字母顺序对模块声明 (mod) 进行排序
newline_style = "Unix"          # 强制统一使用 Unix (LF) 换行符
