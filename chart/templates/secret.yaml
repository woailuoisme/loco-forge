apiVersion: v1
kind: Secret
metadata:
  name: {{ include "locos.fullname" . }}-secret
  labels:
    {{- include "locos.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 数据库连接
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  # JWT 签名密钥 (64 位十六进制字符串)
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_EXPIRATION: {{ .Values.secrets.jwtExpiration | quote }}
  # Redis 缓存连接
  REDIS_CACHE_URL: {{ .Values.secrets.redisCacheUrl | quote }}
  # 对象存储密钥
  STORAGE_S3_ACCESS_KEY: {{ .Values.secrets.storageS3AccessKey | quote }}
  STORAGE_S3_SECRET_KEY: {{ .Values.secrets.storageS3SecretKey | quote }}
  # SMTP 密码
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
