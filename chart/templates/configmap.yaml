apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "locos.fullname" . }}-config
  labels:
    {{- include "locos.labels" . | nindent 4 }}
data:
  # 应用运行模式
  LOCO_ENV: {{ .Values.config.locoEnv | quote }}
  # 服务端口与绑定地址
  PORT: {{ .Values.config.port | quote }}
  BINDING: {{ .Values.config.binding | quote }}
  SERVER_HOST: {{ .Values.config.serverHost | quote }}
  SERVER_IDENT: {{ .Values.config.serverIdent | quote }}
  # 日志配置
  LOGGER_LEVEL: {{ .Values.config.logger.level | quote }}
  LOGGER_FORMAT: {{ .Values.config.logger.format | quote }}
  LOGGER_FILE_ENABLED: {{ .Values.config.logger.fileAppender | quote }}
  # Worker 模式: BackgroundAsync | BackgroundQueue | ForegroundBlocking
  WORKER_MODE: {{ .Values.config.workerMode | quote }}
  # 数据库连接池
  DB_CONNECT_TIMEOUT: {{ .Values.config.database.connectTimeout | quote }}
  DB_IDLE_TIMEOUT: {{ .Values.config.database.idleTimeout | quote }}
  DB_MIN_CONNECTIONS: {{ .Values.config.database.minConnections | quote }}
  DB_MAX_CONNECTIONS: {{ .Values.config.database.maxConnections | quote }}
  DB_AUTO_MIGRATE: {{ .Values.config.database.autoMigrate | quote }}
  # 对象存储 (S3 兼容)
  STORAGE_S3_BUCKET: {{ .Values.config.storage.s3.bucket | quote }}
  STORAGE_S3_REGION: {{ .Values.config.storage.s3.region | quote }}
  STORAGE_S3_ENDPOINT: {{ .Values.config.storage.s3.endpoint | quote }}
  # 缓存 Redis 连接池
  REDIS_CACHE_MAX_SIZE: {{ .Values.config.cache.maxSize | quote }}
  # 邮件服务
  SMTP_HOST: {{ .Values.config.smtp.host | quote }}
  SMTP_PORT: {{ .Values.config.smtp.port | quote }}
  SMTP_SECURE: {{ .Values.config.smtp.secure | quote }}
  SMTP_ENABLE: {{ .Values.config.smtp.enable | quote }}
  SMTP_USER: {{ .Values.config.smtp.user | quote }}
