# Default values for locos Helm chart.
# 部署时通过 -f values-production.yaml 覆盖生产环境参数。

# ── 副本数与部署策略 ──────────────────────────────────────────
replicaCount: 1

image:
  registry: docker.cnb.cool
  repository: ""  # 例如: my-org/my-repo
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: cnb-registry-cred

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# ── 服务暴露 ────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 5150

# ── Ingress 入口（默认关闭）─────────────────────────────────
ingress:
  enabled: false
  ingressClassName: ""
  host: locos.example.com
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  tls: false
  tlsSecretName: ""

# ── 存活与就绪探针 ─────────────────────────────────────────
probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# ── 资源配置 ────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# ── 非敏感应用配置 (注入 ConfigMap) ────────────────────────
config:
  locoEnv: "production"
  port: 5150
  binding: "0.0.0.0"
  serverHost: "http://localhost"
  serverIdent: ""

  logger:
    level: "info"
    format: "compact"
    # 设为 false 禁用文件日志，日志输出到 stdout（K8s 推荐）
    fileAppender: "false"

  workerMode: "BackgroundQueue"

  database:
    connectTimeout: "500"
    idleTimeout: "500"
    minConnections: "1"
    maxConnections: "10"
    autoMigrate: "true"

  storage:
    s3:
      bucket: "locos"
      region: "auto"
      endpoint: ""

  cache:
    maxSize: "10"

  smtp:
    enable: "true"
    host: ""
    port: "587"
    secure: "true"
    user: ""

# ── 敏感配置 (注入 Secret) ──────────────────────────────────
# 部署时通过 --set secrets.xxx= 或外部 values 文件注入，
# 切勿将真实密钥提交到 Git 仓库。

secrets:
  databaseUrl: ""       # postgres://user:pass@host:5432/db_name
  jwtSecret: ""         # 64 hex chars
  jwtExpiration: "604800"  # 7 天
  redisCacheUrl: ""     # redis://user:pass@host:6379/1
  storageS3AccessKey: ""
  storageS3SecretKey: ""
  smtpPassword: ""
