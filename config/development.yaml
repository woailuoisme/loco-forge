# Loco 应用开发环境配置文件 (development.yaml)

# 1. 日志与链路追踪配置 (Logger)
logger:
  enable: true
  # 是否开启美化堆栈跟踪 (RUST_BACKTRACE=1)
  pretty_backtrace: true
  # 日志级别: trace, debug, info, warn, error
  level: info
  # 日志格式: compact, pretty, json
  format: compact
  # 覆盖日志过滤器 (设置为 info 精简启动与数据库底层日志)
  override_filter: info
  # Loco 原生文件追加器 (File Appender) 配置
  file_appender:
    enable: true
    non_blocking: true
    level: info
    format: compact
    rotation: daily
    dir: ./storages/logs
    filename_prefix: locos
    filename_suffix: log
    max_log_files: 7


# 2. Web 服务与中间件配置 (Web Server & Middlewares)
server:
  port: {{ get_env(name="PORT", default="5150") }}
  binding: {{ get_env(name="BINDING", default="localhost") }}
  host: {{ get_env(name="SERVER_HOST", default="http://localhost") }}
  # X-Powered-By 响应头标识 (设置为 "" 空字符串即可禁用 X-Powered-By 响应头)
  ident: "{{ get_env(name='SERVER_IDENT', default='') }}"
  # 全量 Loco 内置中间件显式配置表 (All Built-in Loco Middlewares)
  # 注意: powered_by 不属于 middlewares 节点，而是由上方的 server.ident 统一控制
  middlewares:
    # 1. 日志中间件：记录请求 HTTP 状态码与耗时
    logger:
      enable: true

    # 2. 跨域支持：开发环境开放前端常用端口 (React 3000, Vite 5173 等)
    cors:
      enable: true
      allow_origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
        - "http://127.0.0.1:3000"
        - "http://127.0.0.1:5173"
      allow_headers:
        - "content-type"
        - "authorization"
        - "accept"
      allow_methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "OPTIONS"

    # 3. Gzip / Brotli 数据压缩：节省网络带宽
    compression:
      enable: true

    # 4. 请求 Payload 体积限制 (防止大文件/大 JSON 崩溃)
    limit_payload:
      enable: true
      body_limit: "5mb"

    # 5. ETag 响应缓存哈希
    etag:
      enable: true

    # 6. Panic 异常捕获 (防止单请求 panic 影响服务)
    catch_panic:
      enable: true

    # 7. 全局请求 Trace ID 追踪
    request_id:
      enable: true

    # 8. 真实客户端 IP 提取 (反向代理如 Nginx/Caddy 环境使用)
    remote_ip:
      enable: false

    # 9. 请求超时保护 (超时自动返回 408 Timeout)
    timeout_request:
      enable: false
      timeout: 5000

    # 10. OWASP 安全 HTTP 响应头 (HSTS, CSP, X-Frame-Options 等)
    secure_headers:
      enable: true

    # 11. 静态资源托管服务 (托管前端编译出的静态文件)
    static:
      enable: false
      must_exist: false
      path: "/public"
      folder:
        uri: "public"
        path: "public"

    # 12. SPA 单页应用路由 Fallback 兜底处理
    fallback:
      enable: false
      path: "frontend/dist/index.html"


# 3. 后台异步任务 Worker 配置 (Worker)
workers:
  # 运行模式说明:
  #   - BackgroundAsync:   开发推荐。内存并发运行 (tokio::spawn)，无需 Redis 依赖，进程重启未完成任务会丢失。
  #   - BackgroundQueue:   生产推荐。基于 Redis 消息队列持久化，支持重试/延迟任务/分布式 Worker，可靠性高。
  #   - ForegroundBlocking: 测试推荐。前台同步阻塞运行，主要用于单元/集成测试中确保任务即时完成。
  mode: BackgroundAsync

# 4. 邮件服务配置 (SMTP Mailer，支持标准 SMTP 及 Resend SMTP Relay)
mailer:
  smtp:
    enable: {{ get_env(name="SMTP_ENABLE", default="true") }}
    host: {{ get_env(name="SMTP_HOST", default="127.0.0.1") }}
    port: {{ get_env(name="SMTP_PORT", default="1025") }}
    secure: {{ get_env(name="SMTP_SECURE", default="false") }}
    auth:
      user: "{{ get_env(name='SMTP_USER', default='') }}"
      password: "{{ get_env(name='SMTP_PASSWORD', default='') }}"

# 5. 对象存储配置 (Storage - S3 兼容协议: Garage / MinIO / AWS S3)
storage:
  kind: S3
  ext:
    s3:
      bucket: {{ get_env(name="STORAGE_S3_BUCKET", default="default") }}
      region: {{ get_env(name="STORAGE_S3_REGION", default="garage") }}
      endpoint: {{ get_env(name="STORAGE_S3_ENDPOINT", default="http://127.0.0.1:3900") }}
      access_key_id: {{ get_env(name="STORAGE_S3_ACCESS_KEY", default="change_me_s3_access_key") }}
      secret_access_key: {{ get_env(name="STORAGE_S3_SECRET_KEY", default="change_me_s3_secret_key") }}

# 6. 数据库配置 (Database - PostgreSQL / SQLite)
database:
  uri: {{ get_env(name="DATABASE_URL", default="postgres://postgres:change_me_db_password@127.0.0.1:5432/locos_dev") }}
  enable_logging: false
  connect_timeout: {{ get_env(name="DB_CONNECT_TIMEOUT", default="500") }}
  idle_timeout: {{ get_env(name="DB_IDLE_TIMEOUT", default="500") }}
  min_connections: {{ get_env(name="DB_MIN_CONNECTIONS", default="1") }}
  max_connections: {{ get_env(name="DB_MAX_CONNECTIONS", default="10") }}
  # 应用启动时自动运行数据库迁移
  auto_migrate: {{ get_env(name="DB_AUTO_MIGRATE", default="true") }}
  # 启动时清空数据库 (危险操作，仅适用于开发/测试环境)
  dangerously_truncate: false
  # 启动时重建 Schema (危险操作，仅适用于开发/测试环境)
  dangerously_recreate: false

# 7. 身份认证与安全配置 (Authentication & JWT)
auth:
  jwt:
    # 用于 JWT 签名与验证的私钥
    secret: {{ get_env(name="JWT_SECRET", default="change_me_jwt_secret_64_hex_chars") }}
    # Token 过期时间 (秒，例如 604800 表示 7 天)
    expiration: {{ get_env(name="JWT_EXPIRATION", default="604800") }}

# 8. 缓存配置 (Cache - Redis / Valkey 共享缓存)
cache:
  kind: Redis
  uri: "{{ get_env(name='REDIS_CACHE_URL', default='redis://127.0.0.1:6379/1') }}"
  # 内存/连接最大限制
  max_size: {{ get_env(name='REDIS_CACHE_MAX_SIZE', default='10') }}

# 9. 定时任务调度配置 (Scheduler)
scheduler:
  output: stdout
  jobs:
    health_check:
      run: "health:check"
      schedule: "run every 1 hour"
      output: silent
      tags: ['health']
