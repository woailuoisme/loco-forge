[package]
name = "migration"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
# 1. Loco.rs 框架基础依赖
loco-rs = { workspace = true }

# 2. SeaORM 数据库迁移引擎 (最佳工程实践配置)
sea-orm-migration = { workspace = true, features = [
  "sqlx-postgres",        # 启用 PostgreSQL 数据库迁移驱动支持
  "sqlx-sqlite",          # 启用 SQLite 数据库迁移驱动支持 (本地开发与测试)
  "runtime-tokio-rustls", # 启用 Tokio 异步运行时与 Rustls TLS 安全传输加密
] }
