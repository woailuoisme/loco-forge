# Lefthook Git hooks configuration
# Docs: https://lefthook.dev/configuration/

pre-commit:
  parallel: false
  jobs:
    - name: fmt
      glob: "*.rs"
      run: cargo fmt --all

    - name: clippy
      glob: "*.rs"
      run: cargo clippy --fix --allow-dirty --allow-staged

    - name: rumdl
      glob: "*.md"
      run: rumdl fmt {staged_files}

