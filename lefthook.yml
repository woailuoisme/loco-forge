# Lefthook Git hooks configuration
# Docs: https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  jobs:
    - name: fmt
      glob: "*.rs"
      run: cargo fmt --all -- --check

    - name: clippy
      glob: "*.rs"
      run: cargo clippy -- -D warnings

    - name: rumdl
      glob: "*.md"
      run: rumdl check {staged_files}

pre-push:
  jobs:
    - name: test
      run: cargo nextest run

