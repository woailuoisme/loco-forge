app:
  name: "Loco"

auth:
  welcome_title: "Welcome to %{app_name}!"
  welcome_user: "Welcome to %{app_name}, %{name}!"
  verify_email_subject: "[%{app_name}] Please verify your email address"
  reset_password_subject: "[%{app_name}] Reset your account password"
  magic_link_subject: "[%{app_name}] Your passwordless magic login link"
  link_expire_notice: "This link will expire in %{minutes} minutes."
  invalid_magic_link_token: "The magic link token is invalid or expired."
  user_not_found: "User with email '%{email}' was not found."
  email_already_exists: "An account with email '%{email}' already exists."
  password_reset_sent: "If an account with email '%{email}' exists in our system, a password reset link has been sent."

errors:
  unauthorized: "Authentication required to access this resource."
  bad_request: "Invalid request parameters."
  internal_error: "An internal server error occurred. Please try again later."

validation:
  # General & Presence
  required: "This field is required."
  not_empty: "This field cannot be empty."
  invalid: "Invalid field value."

  # Format & Types
  email: "Invalid email address format."
  url: "Invalid URL format."
  phone: "Invalid phone number format."
  ip: "Invalid IP address."
  uuid: "Invalid UUID format."
  json: "Invalid JSON format."

  # String Length & Size
  min_length: "Must be at least %{min} characters long."
  max_length: "Cannot exceed %{max} characters."
  length_range: "Must be between %{min} and %{max} characters long."
  exact_length: "Must be exactly %{length} characters long."

  # Numerical Values & Range
  numeric: "Must be a valid number."
  integer: "Must be an integer."
  min_value: "Must be greater than or equal to %{min}."
  max_value: "Must be less than or equal to %{max}."
  range: "Must be between %{min} and %{max}."
  positive: "Must be a positive number."

  # Pattern & Comparison
  alphanumeric: "Must contain only letters and numbers."
  alpha: "Must contain only letters."
  digits: "Must contain only digits."
  must_match: "Does not match the target field."
  regex: "Format does not match required pattern."

  # Custom & Business Constraints
  unique: "This value has already been taken."
  exists: "The selected value is invalid."
  invalid_choice: "Selected value is not in the allowed options."
  future_date: "Date must be in the future."
  past_date: "Date must be in the past."
