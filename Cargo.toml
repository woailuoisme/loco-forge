[workspace]

[package]
name = "loco-starter"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "lococ"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.0" }

[dependencies]
# 1. 核心框架与异步运行时 (Core Framework & Async Runtime)
loco-rs = { workspace = true, features = [
  "storage_aws_s3",
  "cache_redis",
  "worker_redis",
  "testing",
] }
tokio = { version = "1.53", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
# 2. 序列化与基础工具库 (Serialization & Core Utilities)
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
chrono = { version = "0.4" }
uuid = { version = "1.24", features = ["v4"] }
validator = { version = "0.20" }
regex = { version = "1.13" }
# 3. 数据库与数据迁移 (Database & ORM)
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
# 4. 日志与链路追踪 (Logging & Observability)
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# 6. API 文档与前端契约生成 (API Docs & TypeScript Bindings)
# ts-rs 自动为 DTO 导出 TypeScript 类型定义文件，供 SPA 前端消费
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
include_dir = { version = "0.7" }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
utoipa-redoc = { version = "6", features = ["axum"] }

[[bin]]
name = "lococ"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "4.0.1" }
rstest = { version = "0.26" }
insta = { version = "1.48", features = ["redactions", "yaml", "filters"] }

# 优化开发构建体积 (把调试信息级别降为 1 并在 macOS 开启 unpacked 符号拆分，同时保留 panic 堆栈追踪)
[profile.dev]
debug = 1
split-debuginfo = "unpacked"

# 屏蔽所有第三方依赖包的调试符号（仅保留项目自身代码符号，大幅削减 target/debug/deps 体积）
[profile.dev.package."*"]
debug = 0


