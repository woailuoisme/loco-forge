[workspace]
members = [".", "migration"]
resolver = "3" # MSRV-aware：不兼容 rust-version 的依赖版本自动回退

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
loco-rs = { version = "1.1" }
sea-orm = { version = "2.0" }
sea-orm-migration = { version = "2.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
ambiguous_negative_literals = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
# missing_debug_implementations 豁免理由见 AGENTS.md（仅剩零字段门面 struct）

[workspace.lints.clippy]
# 1. 现代语法
manual_let_else = "warn"
implicit_clone = "warn"
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"
use_self = "warn"
needless_lifetimes = "deny"
double_must_use = "deny"
macro_use_imports = "warn"
cloned_instead_of_copied = "warn"
needless_raw_strings = "warn"
needless_raw_string_hashes = "warn"

# 2. 异步并发与生产防护
if_let_mutex = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
match_wild_err_arm = "warn"
dbg_macro = "warn"
exit = "warn"
unimplemented = "warn"

# 3. 迭代器与零堆分配
manual_is_variant_and = "warn"
manual_string_new = "warn"
filter_map_next = "warn"
iter_filter_is_some = "warn"
iter_filter_is_ok = "warn"
option_as_ref_cloned = "warn"
flat_map_option = "warn"
map_unwrap_or = "warn"
zero_sized_map_values = "warn"
linkedlist = "warn"
needless_for_each = "warn"

# 4. 字符串与模式匹配
single_char_pattern = "warn"
manual_instant_elapsed = "warn"
manual_assert = "warn"
range_plus_one = "warn"
unnested_or_patterns = "warn"
match_same_arms = "warn"

# 5. 控制流与类型设计
fn_params_excessive_bools = "warn"
option_option = "warn"
ref_option = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
cast_lossless = "warn"
redundant_clone = "warn"
needless_continue = "warn"
bool_to_int_with_if = "warn"
unnecessary_join = "warn"
unnecessary_self_imports = "warn"
useless_let_if_seq = "warn"
semicolon_if_nothing_returned = "warn"
semicolon_outside_block = "warn"
redundant_else = "warn"
redundant_type_annotations = "warn"

# 6. Pragmatic Rust Guidelines 对齐：日志禁令 / 错误上下文 / 文档可扫读
print_stdout = "warn"
print_stderr = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
deref_by_slicing = "warn"
assertions_on_result_states = "warn"
too_long_first_doc_paragraph = "warn"

[package]
name = "locos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "locos"

[lints]
workspace = true

[dependencies]
# 1. 框架与运行时
loco-rs = { workspace = true, features = [
  "storage_aws_s3",
  "cache_redis",
  "worker_redis",
  "auth",
  "with-db",
] }
# loco 以 default-features = false 引入 opendal 且不带 HTTP transport，
# 缺少 "http-transport-reqwest" 时 storage_aws_s3 会报错，故此处补齐特性
opendal = { version = "0.58", default-features = false, features = [
  "auto-register-services",
  "http-transport-reqwest",
] }
tokio = { version = "1.54", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
  "signal",
  "fs",
  "io-util",
] }
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio-util = { version = "0.7" }
async-trait = { version = "0.1" } # Loco Hooks/Initializer 要求
governor = { version = "0.10", features = ["jitter", "quanta"] }
tower_governor = { version = "0.8", features = ["tracing"] }
totp-rs = { version = "6.0", features = ["otpauth", "gen_secret"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] } # 状态序列化存库为官方推荐
url = { version = "2" }
jsonwebtoken = { version = "10", features = ["use_pem"] }

# 2. 数据库与迁移
migration = { path = "migration" }
sea-orm = { workspace = true, features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-rust_decimal",
] }

# 3. 网络与检索
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "json",
  "form",
  "stream",
  "multipart",
] }
meilisearch-sdk = { version = "0.33", default-features = false, features = [
  "reqwest",
  "tls",
  "jwt_rust_crypto",
] }
mime_guess = { version = "2" }
bytes = { version = "1", features = ["serde"] }

# 4. 序列化、校验与数据类型
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
validator = { version = "0.20", features = ["derive"] }
thiserror = { version = "2" }
color-eyre = { version = "0.6", features = ["tracing-error", "issue-url"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.29", features = ["v4", "v7", "serde"] }
secrecy = { version = "0.10.3", features = ["serde"] }
base64 = { version = "0.23" }
rand = { version = "0.10", features = ["serde"] }
rust-i18n = { version = "4.2.2" }
sha2 = { version = "0.11" }
dotenvy = { version = "0.15" }
# 非直接调用：仅为开启 vendored，令 webauthn-attestation-ca 的 openssl-sys
# 从源码编译（免 pkg-config / 系统 libssl，并静态链接进二进制）
openssl = { version = "0.10", features = ["vendored"] }

# 5. CLI
inquire = { version = "0.9", features = ["date", "editor", "macros"] }

# 6. 日志
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 7. 表格、图像与二维码
calamine = { version = "0.37", features = ["chrono"] }
rust_xlsxwriter = { version = "0.101", features = [
  "constant_memory",
  "chrono",
  "serde",
] }
image = { version = "0.25", features = ["serde", "color_quant"] }
qrcode = { version = "0.14" }

# 8. API 文档与前端契约
utoipa = { version = "6", features = [
  "axum_extras",
  "chrono",
  "uuid",
  "preserve_order",
  "openapi_extensions",
  "repr",
  "decimal",
] }
utoipa-scalar = { version = "0.4", features = ["axum"] }
utoipa-redoc = { version = "7", features = ["axum"] }
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
include_dir = { version = "0.7" }

[[bin]]
name = "locos"
path = "src/bin/main.rs"
required-features = []

# include_dir 仅以宏使用；openssl 仅用于开启 vendored 特性，均无法被静态识别
[package.metadata.cargo-machete]
ignored = ["include_dir", "openssl"]

[[test]]
name = "integration"
path = "tests/mod.rs"

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
tower = { version = "0.5", features = ["util"] } # ServiceExt::oneshot
serial_test = { version = "4.0" }
rstest = { version = "0.28" }

# 关闭增量编译换取更小的调试信息；split-debuginfo 由 .cargo/config.toml 统一设置
[profile.dev]
opt-level = 0
debug = 0
incremental = false

# panic = "abort"：panic 即终止进程，与 Rust Guidelines M-PANIC-IS-STOP 一致
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# jemalloc 仅 Linux 启用；src/bin/main.rs 的 #[global_allocator] 需保持相同 cfg
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.7", features = [
  "unprefixed_malloc_on_supported_platforms",
] }
