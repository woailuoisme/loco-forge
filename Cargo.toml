[workspace]

[package]
name = "loco-starter"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "lococ"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.0" }

[dependencies]
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
validator = { version = "0.20" }
uuid = { version = "1.6", features = ["v4"] }
# ts-rs derives the TypeScript bindings for the `dtos` (the typed JSON API
# contract). Present for every db app; the SPA frontend consumes the exports,
# and a headless app can still emit them for external consumers.
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
include_dir = { version = "0.7" }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
utoipa-redoc = { version = "5", features = ["axum"] }

[[bin]]
name = "lococ"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }

# 优化开发构建体积 (把调试信息级别降为 1 并在 macOS 开启 unpacked 符号拆分，同时保留 panic 堆栈追踪)
[profile.dev]
debug = 1
split-debuginfo = "unpacked"

# 屏蔽所有第三方依赖包的调试符号（仅保留项目自身代码符号，大幅削减 target/debug/deps 体积）
[profile.dev.package."*"]
debug = 0


