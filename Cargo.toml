[workspace]

[package]
name = "locos"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.97.1"
default-run = "locos"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.0" }
sea-orm = { version = "2.0" }
sea-orm-migration = { version = "2.0" }

[dependencies]
# 1. 核心框架与异步运行时 (Core Framework & Async Runtime)
loco-rs = { workspace = true, features = [
  "storage_aws_s3",
  "cache_redis",
  "worker_redis"
] }
tokio = { version = "1.53", default-features = false, features = [
  "rt-multi-thread", # 启用 Tokio 多线程 Work-Stealing 异步运行时调度器 (Loco/Axum 必须)
  "macros",          # 启用 Tokio 过程宏支持 (#[tokio::main], #[tokio::test], select!)
  "time",            # 启用异步定时器与超时控制 (sleep, timeout, interval)
  "sync",            # 启用异步同步原语与通道 (mpsc, oneshot, watch, Mutex, RwLock)
  "signal",          # 启用操作系统信号监听 (SIGINT/SIGTERM, 优雅停机 Graceful Shutdown)
] }
tokio-util = { version = "0.7" } # Tokio 异步工具库扩展 (包含 CancellationToken/Codec/TaskTracker)
async-trait = { version = "0.1" } # 允许在 Trait 中定义 async 方法的属性宏 (Hooks/Initializer 必须)
axum = { version = "0.8", features = ["multipart","macros"] } # 底层 Web 框架支持 (开启 multipart 支持表单文件上传)
governor = "0.10" # 高性能 Token/Leaky Bucket 频控算法核心库
tower_governor = { version = "0.8" } # 基于 Governor 算法的 Tower/Axum 速率限制中间件 (Rate Limiting)

# 2. 网络与 HTTP 客户端 (Networking & HTTP Client)
reqwest = { version = "0.13.4", features = ["json"] }
meilisearch-sdk = "0.33" # Meilisearch 官方 Rust SDK (全文检索)

# 3. 序列化与基础工具库 (Serialization & Core Utilities)
serde = { version = "1", features = ["derive"] } # 通用数据序列化与反序列化框架
serde_json = { version = "1" } # JSON 数据格式化与解析工具
thiserror = { version = "2" } # 自定义错误类型派生宏 (std::error::Error)

chrono = { version = "0.4", features = ["serde"] } # 日期与时间跨时区处理库 (Loco/SeaORM/utoipa 全栈统一标准)
uuid = { version = "1.24", features = ["v4", "serde"] } # 通用唯一标识符 (UUID v4) 生成器
validator = { version = "0.20" } # DTO 请求参数格式校验器 (锁定 0.20.x 需与 loco-rs 1.0 的 Validate Trait 保持一致)
base64 = { version = "0.23" } # Base64 数据编解码工具 (用于二进制/Token/图片数据编解码)
secrecy = { version = "0.10.3", features = ["serde"] }
regex = { version = "1.13" } # 高性能正则表达式匹配工具
rust-i18n = {version="4"} # 多语言国际化 (i18n) 翻译框架
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }

# 4. 数据库与数据迁移 (Database & ORM)
migration = { path = "migration" }
sea-orm = { workspace = true, features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }

# 5. 日志与链路追踪 (Logging & Observability)
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# 6. Excel 与电子表格处理 (Excel & Spreadsheet Processing)
calamine = { version = "0.36" }
rust_xlsxwriter = { version = "0.97", features = ["constant_memory"] }

# 7. 图像与二维码生成 (Image & QR Code Processing)
image = { version = "0.25" }
qrcode = { version = "0.14" }

# 8. API 文档与前端契约生成 (API Docs & TypeScript Bindings)
# ts-rs 自动为 DTO 导出 TypeScript 类型定义文件，供 SPA 前端消费
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
include_dir = { version = "0.7" }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }

[[bin]]
name = "locos"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
tower = { version = "0.5" }
serial_test = { version = "4.0.1" }
rstest = { version = "0.26" }
insta = { version = "1.48", features = [
  "redactions",
  "yaml",
  "json",
  "glob",
  "filters",
] }

# 优化开发构建体积 (把调试信息级别降为 1 并在 macOS 开启 unpacked 符号拆分，同时保留 panic 堆栈追踪)
[profile.dev]
debug = 1
split-debuginfo = "unpacked"

# 屏蔽所有第三方依赖包的调试符号（仅保留项目自身代码符号，大幅削减 target/debug/deps 体积）
[profile.dev.package."*"]
debug = 0
