# 自动发版：push main 时触发两种发版策略
#   1. release-please: 创建 Release PR → 合并后自动打 tag 和 GitHub Release
#   2. semantic-release: 直接分析 commit 自动打 tag 和 GitHub Release（无需 PR）
# 文档:
#   https://github.com/googleapis/release-please-action
#   https://github.com/cycjimmy/semantic-release-action
name: Release

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: write # 写入 Release 和 tag
  pull-requests: write # 管理 Release PR

jobs:
  # ── release-please：PR 驱动的渐进式发版 ────────────────────────────────
  # 检测 conventional commits，自动创建/更新 Release PR
  # 合并 PR 后创建 GitHub Release + 版本 tag
  release-please:
    runs-on: ubuntu-latest
    steps:
      # v4 是最新主版本
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── semantic-release：全自动语义化发版 ─────────────────────────────────
  # 直接分析 commit 历史，自动计算版本号，创建 GitHub Release + 版本 tag
  # 需要根目录有 .releaserc 配置文件
  semantic-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整 git 历史，semantic-release 需要分析 commit

      # v6 是最新主版本
      - uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
