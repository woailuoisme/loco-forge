name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_trixie:
        description: "Build Debian Slim (trixie) image"
        type: boolean
        default: true
      build_alpine:
        description: "Build Alpine Musl (alpine) image"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix
        id: set-matrix
        run: |
          BUILD_TRIXIE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_trixie || 'true' }}"
          BUILD_ALPINE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_alpine || 'true' }}"

          ITEMS=()
          if [ "$BUILD_TRIXIE" = "true" ]; then
            ITEMS+=('{"variant":"trixie","dockerfile":"Dockerfile"}')
          fi
          if [ "$BUILD_ALPINE" = "true" ]; then
            ITEMS+=('{"variant":"alpine","dockerfile":"Dockerfile.alpine"}')
          fi

          if [ ${#ITEMS[@]} -eq 0 ]; then
            echo "Error: no image variant selected"
            exit 1
          fi

          JSON=$(IFS=,; echo "[${ITEMS[*]}]")
          echo "matrix={\"include\":$JSON}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push (${{ matrix.variant }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Distro tag: :trixie or :alpine
            type=raw,value=${{ matrix.variant }}
            # Git tag with variant suffix: v1.0.0-trixie
            type=ref,event=tag,suffix=-${{ matrix.variant }}
            # `:latest` only when releasing trixie on a v* tag
            type=raw,value=latest,enable=${{ matrix.variant == 'trixie' && startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
