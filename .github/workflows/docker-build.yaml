# GitHub Actions — 镜像构建并推送到 GHCR
#
# 触发方式:
#   1. push main          → 构建并推送 :latest / :sha-xxx（Debian Trixie）
#   2. push tag 'v*'      → 构建并推送 :trixie / :v1.0.0-trixie / :sha-xxx
#   3. workflow_dispatch  → 手动选择 trixie / alpine / both
#
# 构建加速要点:
#   - 依赖层由 Dockerfile 的 cargo-chef 预编译，配合 GHA 缓存跨 run 复用
#   - 只构建 linux/amd64，避免 QEMU 模拟带来的数倍慢速
#   - concurrency 取消同一 ref 的重复构建
name: Docker Build & Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      variant:
        description: 构建目标
        type: choice
        default: trixie
        options:
          - trixie
          - alpine
          - alpine-multi
          - both

# 同一 ref 只保留最新一次构建，避免 tag 重推时并发写缓存
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push (trixie)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # 手动触发选择 alpine 时跳过 Debian 构建
    if: github.event_name != 'workflow_dispatch' || inputs.variant != 'alpine'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Distro tag: :trixie
            type=raw,value=trixie
            # Git tag with variant suffix: v1.0.0-trixie
            type=ref,event=tag,suffix=-trixie
            # :latest on default branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            # Commit sha tag（便于回滚到具体构建）
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA 缓存无需先把镜像层拉到 runner，比 registry 缓存快一个量级
          cache-from: type=gha,scope=trixie
          cache-to: type=gha,mode=max,scope=trixie

  # 仅手动触发：Alpine Musl 静态镜像（Dockerfile.alpine）
  build-and-push-alpine:
    name: Build & Push (alpine)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' && (inputs.variant == 'alpine' || inputs.variant == 'alpine-multi' || inputs.variant == 'both')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Distro tag: :alpine
            type=raw,value=alpine
            # Multi-arch tag: :alpine-multi（仅全架构构建时）
            type=raw,value=alpine-multi,enable=${{ inputs.variant == 'alpine-multi' }}
            # Git tag with variant suffix: v1.0.0-alpine
            type=ref,event=tag,suffix=-alpine
            # Commit sha tag
            type=sha,prefix=alpine-sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.alpine
          platforms: ${{ inputs.variant == 'alpine-multi' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=alpine
          cache-to: type=gha,mode=max,scope=alpine
