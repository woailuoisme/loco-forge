name: Docker Build & Push

on:
  # push:
  #   branches:
  #     - main
  #     - master
  #   tags:
  #     - 'v*'
  workflow_dispatch:
    inputs:
      build_trixie:
        description: "构建 Debian Slim (trixie) 镜像"
        type: boolean
        default: true
      build_alpine:
        description: "构建 Alpine Musl (alpine) 镜像"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 根据多选项计算要构建的矩阵 ──────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix
        id: set-matrix
        run: |
          BUILD_TRIXIE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_trixie || 'true' }}"
          BUILD_ALPINE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_alpine || 'true' }}"

          ITEMS=()
          if [ "$BUILD_TRIXIE" = "true" ]; then
            ITEMS+=('{"variant":"trixie","dockerfile":"Dockerfile","platforms":"linux/amd64"}')
          fi
          if [ "$BUILD_ALPINE" = "true" ]; then
            ITEMS+=('{"variant":"alpine","dockerfile":"Dockerfile.alpine","platforms":"linux/amd64"}')
          fi

          if [ ${#ITEMS[@]} -eq 0 ]; then
            echo "错误: 未勾选任何要构建的镜像变体"
            exit 1
          fi

          JSON=$(IFS=,; echo "[${ITEMS[*]}]")
          echo "matrix={\"include\":$JSON}" >> "$GITHUB_OUTPUT"

  # ── 矩阵并行构建 ───────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push (${{ matrix.variant }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 发行版固定 tag：:trixie 或 :alpine
            type=raw,value=${{ matrix.variant }}
            # latest 仅 trixie 变体在 main/master 分支时附加
            type=raw,value=latest,enable=${{ matrix.variant == 'trixie' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
            # commit sha 带变体后缀：sha-abc1234-trixie
            type=sha,prefix=sha-,suffix=-${{ matrix.variant }}
            # Git tag（如 v1.0.0）带变体后缀：v1.0.0-trixie
            type=ref,event=tag,suffix=-${{ matrix.variant }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
