# GitHub Actions — 镜像构建并推送到 GHCR
#
# 触发方式:
#   1. push main          → 构建并推送 :latest / :sha-xxx（Debian Trixie）
#   2. push tag 'v*'      → 构建并推送 :trixie / :v1.0.0-trixie / :sha-xxx
#   3. workflow_dispatch  → 手动触发构建
#
# 构建加速要点:
#   - 依赖层由 Dockerfile 的 cargo-chef 预编译，配合 GHA 缓存跨 run 复用
#   - 只构建 linux/amd64，避免 QEMU 模拟带来的数倍慢速
#   - concurrency 取消同一 ref 的重复构建
name: Docker Build & Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# 同一 ref 只保留最新一次构建，避免 tag 重推时并发写缓存
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push (trixie)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Distro tag: :trixie
            type=raw,value=trixie
            # Git tag with variant suffix: v1.0.0-trixie
            type=ref,event=tag,suffix=-trixie
            # :latest on default branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            # Commit sha tag（便于回滚到具体构建）
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA 缓存无需先把镜像层拉到 runner，比 registry 缓存快一个量级
          cache-from: type=gha
          cache-to: type=gha,mode=max
